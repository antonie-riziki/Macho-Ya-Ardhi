<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Macho Ya Ardhi</title>
<style>body{font-family:Arial;max-width:980px;margin:20px auto;padding:0 16px} .card{border:1px solid #ddd;border-radius:10px;padding:16px;margin-top:16px} .badge{padding:4px 8px;border-radius:999px;color:#fff}.LOW{background:#2e7d32}.MEDIUM{background:#ef6c00}.HIGH{background:#c62828} pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}</style>
</head><body>
<h1>Macho Ya Ardhi</h1><p>AI land transaction fraud stress-test for Kenya</p>
<form id='verifyForm'>
<input type='text' name='buyer_name' placeholder='Buyer name'>
<input type='text' name='seller_name' placeholder='Seller name'>
<input type='text' name='county' placeholder='County'>
<input type='text' name='parcel_number' placeholder='Parcel number'>
<input type='file' name='documents' multiple required>
<button type='submit'>Verify Documents</button>
</form>
<div id='loading' style='display:none'>Analyzing with Gemini + risk engine...</div>
<div id='result' class='card' style='display:none'></div>
<script>
const form=document.getElementById('verifyForm');
form.addEventListener('submit', async (e)=>{e.preventDefault();
const fd=new FormData(form);document.getElementById('loading').style.display='block';
const res=await fetch('/api/verify-land/',{method:'POST',body:fd});
const data=await res.json();document.getElementById('loading').style.display='none';
const out=document.getElementById('result'); out.style.display='block';
if(!res.ok){out.innerHTML='<b>Error:</b> '+(data.error||'Unexpected error');return;}
out.innerHTML=`<h3>Risk: <span class='badge ${data.risk.level}'>${data.risk.level}</span> Score ${data.risk.score}</h3>
<p><b>Parcel numbers:</b> ${data.extracted_documents.map(d=>d.parcel_number||'-').join(', ')}</p>
<p><b>Owners:</b> ${data.extracted_documents.map(d=>d.registered_owner||'-').join(', ')}</p>
<p><b>Inconsistencies:</b></p><ul>${data.risk.findings.map(f=>`<li>${f}</li>`).join('')}</ul>
<p><b>Gazette matches:</b></p><ul>${(data.gazette_matches||[]).map(g=>`<li>${g.parcel_number} - ${g.issue} (${g.notice_date})</li>`).join('')||'<li>None</li>'}</ul>
<p><b>Recommendations:</b></p><ul>${data.risk.recommendations.map(r=>`<li>${r}</li>`).join('')}</ul>
<pre>${data.markdown_report}</pre>`;
});
</script>
</body></html>
